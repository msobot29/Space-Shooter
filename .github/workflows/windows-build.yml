name: Build Adriatic Uprising for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and Windows release template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -j /tmp/templates.tpz 'templates/windows_release_x86_64.exe' \
            -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Import Godot resources and check scripts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export single Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "Windows Desktop" "build/AdriaticUprising.exe"
          test -s "build/AdriaticUprising.exe"

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: AdriaticUprising-Windows-Alpha
          path: build/AdriaticUprising.exe
          if-no-files-found: error
